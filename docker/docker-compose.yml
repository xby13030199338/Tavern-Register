services:
  tavern-register:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tavern-register:local
    container_name: tavern-register
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # 端口映射支持跟随 docker/.env 里的 PORT（默认 3070）
      - "${PORT:-3070}:${PORT:-3070}"
    env_file:
      # 直接读取 docker/.env
      - .env
    volumes:
      # 持久化数据（统一放在 docker/ 目录下）
      - ./data:/app/data
    healthcheck:
      # 使用 Node 自带 fetch，避免依赖 wget/curl 在镜像中是否存在
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||3070;fetch('http://localhost:'+p+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tavern-register-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
