services:
  tavern-register:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tavern-register:local
    container_name: tavern-register
    restart: unless-stopped
    ports:
      - "3070:3070"
    env_file:
      # 直接读取 docker/.env
      - .env
    volumes:
      # 持久化数据（统一放在 docker/ 目录下）
      - ./data:/app/data
    healthcheck:
      # 使用 Node 自带 fetch，避免依赖 wget/curl 在镜像中是否存在
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3070/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
